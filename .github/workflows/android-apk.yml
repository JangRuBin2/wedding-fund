name: Android APK

# app/ 이 바뀌면 자동으로 APK를 빌드해서 GitHub Releases에 올림.
# 폰에서 레포의 Releases 페이지 → 최신 apk-* → wedding-fund.apk 받아서 설치하면 됨.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-24.04 러너에 Android SDK 기본 설치돼 있음 (ANDROID_HOME)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      # 서명 secret이 잘못 들어가 있으면 8분 빌드 끝에 실패하지 않게 처음에 바로 확인
      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: .
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "서명 키 secret 없음 → 디버그 키로 서명"; exit 0; fi
          trim() { printf %s "$1" | tr -d '[:space:]'; }
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "$(trim "${!v}")" ] || { echo "::error::ANDROID_$v secret이 비어 있어요"; exit 1; }
          done
          trim "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/check.keystore" 2>/dev/null \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 값이 잘렸거나 올바르지 않아요"; exit 1; }
          PW=$(trim "$KEYSTORE_PASSWORD")
          keytool -list -keystore "$RUNNER_TEMP/check.keystore" -storepass "$PW" >/dev/null 2>&1 \
            || { echo "::error::ANDROID_KEYSTORE_PASSWORD가 틀렸거나 ANDROID_KEYSTORE_BASE64 값이 중간에 잘렸어요"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/check.keystore" -storepass "$PW" -alias "$(trim "$KEY_ALIAS")" >/dev/null 2>&1 \
            || { echo "::error::ANDROID_KEY_ALIAS가 키 파일에 없어요"; exit 1; }
          echo "서명 secret 확인 완료"

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Expo prebuild (android 네이티브 프로젝트 생성)
        run: npx expo prebuild --platform android --no-install --clean

      # 업데이트 설치가 되려면 versionCode가 계속 올라가야 해서 실행 번호로 지정
      - name: Version code
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle && grep -n versionCode android/app/build.gradle

      # 서명 키를 secrets에 넣어두면 그걸로 서명 → 업데이트 시 덮어쓰기 설치 가능.
      # 없으면 디버그 키로 서명 (빌드마다 키가 달라져서 업데이트 때 기존 앱 삭제 후 설치해야 함)
      - name: Release signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "서명 키 없음 → 디버그 키로 서명"; exit 0; fi
          trim() { printf %s "$1" | tr -d '[:space:]'; }
          KEYSTORE_PASSWORD=$(trim "$KEYSTORE_PASSWORD"); KEY_ALIAS=$(trim "$KEY_ALIAS"); KEY_PASSWORD=$(trim "$KEY_PASSWORD")
          trim "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle <<EOF

          android {
            signingConfigs {
              ci {
                storeFile file("release.keystore")
                storePassword "$KEYSTORE_PASSWORD"
                keyAlias "$KEY_ALIAS"
                keyPassword "$KEY_PASSWORD"
              }
            }
            buildTypes { release { signingConfig signingConfigs.ci } }
          }
          EOF

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk wedding-fund.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wedding-fund-apk
          path: app/wedding-fund.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" wedding-fund.apk \
            --title "결혼자금 APK #${{ github.run_number }}" \
            --notes "커밋 ${GITHUB_SHA::7} 빌드. 갤럭시에서 wedding-fund.apk 받아서 설치 (출처를 알 수 없는 앱 허용 필요)" \
            --target "$GITHUB_SHA" --latest
