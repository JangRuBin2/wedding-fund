plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.paymentlistener'
version = '0.1.0'

android {
  namespace "expo.modules.paymentlistener"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // 매일 아침 팁 알림 (재부팅 후에도 예약 유지)
  implementation "androidx.work:work-runtime-ktx:2.10.1"
}
